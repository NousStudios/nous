name: nous
description: "Um novo projeto Flutter."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flex_color_picker: ^3.6.0
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.1.2
  printing: ^5.13.0
  pdf: ^3.11.0
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Belleza
      fonts:
        - asset: assets/fonts/Belleza-Regular.ttf