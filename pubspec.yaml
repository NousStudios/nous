name: nous
description: "Um novo projeto Flutter."

publish_to: 'none'

version: 1.1.62+164

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flex_color_picker: ^3.6.0
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.1.2
  printing: ^5.13.0
  pdf: ^3.11.0
  file_selector: ^1.0.3
  sqflite_common_ffi: ^2.4.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  ffi: ^2.1.3
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.2
  image_picker: ^1.1.2
  record: ^7.1.2
  flutter_webrtc: ^1.6.3
  cryptography: ^2.9.0
  url_launcher: ^6.3.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  local_auth: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - CHANGELOG.md

  fonts:
    - family: Belleza
      fonts:
        - asset: assets/fonts/Belleza-Regular.ttf